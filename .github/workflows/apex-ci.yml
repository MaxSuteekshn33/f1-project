name: APEX CI
on:
  push: { paths: ["apex/**", ".github/workflows/apex-ci.yml"] }
  pull_request: { paths: ["apex/**"] }
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apex/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apex/backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apex/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apex/frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
